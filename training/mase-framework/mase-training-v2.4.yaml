schema: mase-training/v2
title: MASE v2.4 开发过程框架
source_version: 2.4.0
slide_count: 66
default_track: core
template:
  path: training/mase-framework/MASE框架培训讲义V1.pptx
  sha256: fcdf4bd0b8fe3adb5316c8dbccf6e70d91b0274857a5f97827709053886fe188
  slides: 37
output: training/mase-framework/MASE框架培训讲义V2.4.pptx
forbidden_claims:
  - 每 20 次对话
  - 人不读需求文档
  - 测试绿灯 = 实现正确
  - GWT 是唯一事实源
  - 整个流水线的唯一真相源
  - 六阶段 · 层层递进
  - cp -r openspec/changes/_template/
  - 所有外部依赖编写验证脚本并跑通
  - 每个功能必须有自动化测试
  - 人不需逐行审阅代码
  - MASE_SOURCE
  - ../MASE
  - 相邻 MASE 源码
  - 六步教学主线
  - 三 Profile
  - Release Overlay
  - Web 验证与 Sandbox
  - UI contract
  - P0 journey
  - P1 regression
  - 保存 seed
  - shrink
  - fixture
  - adapter
  - flaky
  - trace/
  - AI 写的测试绝不可信
slides:
  - number: 1
    title: MASE v2.4 开发过程框架
    template_slide: 1
    updates:
      - shape: 1
        slot: title
        text: MASE v2.4 开发过程框架
      - shape: 2
        slot: subtitle
        text: 四 Agent · 六步开发主线 · 风险自适应 · 契约与证据闭环
      - shape: 3
        slot: brand
        text: MASE (Measures AI Software Engineering) · v2.4.0

  - number: 2
    title: 为什么需要统一框架
    template_slide: 2
    updates:
      - shape: 3
        slot: problem-1
        text: |-
          过程容易失控
          AI 写得快，但需求、设计、代码和测试可能各说各话
      - shape: 5
        slot: problem-2
        text: |-
          小事流程过重
          所有 change 都套完整设计，时间花在仪式而非风险上
      - shape: 7
        slot: problem-3
        text: |-
          全绿仍可能误伤
          新测试证明新增行为，却未必发现旧逻辑、调用边或副作用被削弱
      - shape: 8
        slot: goal
        text: 让 Agentic Coding 高效交付正确、健壮、优化且易于维护的代码

  - number: 3
    title: 学习目标与课程地图
    track: deep-dive
    template_slide: 25
    updates:
      - {shape: 0, slot: section-label, text: "深入学习 · 导航"}
      - {shape: 1, slot: title, text: "学习目标与课程地图"}
      - {shape: 2, slot: subtitle, text: "完成课程后，能够为一个真实变更选择重量、分析影响并组织证据"}
      - {shape: 4, slot: card-1, text: "会选择\n区分轻量、标准、严格三种过程档位"}
      - {shape: 6, slot: card-2, text: "会分析\n识别调用链、隐性依赖和系统边界"}
      - {shape: 8, slot: card-3, text: "会验证\n设计分层测试、门禁计划和回滚验证"}
      - {shape: 10, slot: card-4, text: "会取证\n判断通过、过期、缺失和无效证据"}
      - {shape: 12, slot: footer, text: "高效交付 · 需求正确 · 运行健壮 · 质量优化 · 整洁可维护"}

  - number: 4
    title: 框架全景
    template_slide: 3
    updates:
      - shape: 1
        slot: subtitle
        text: 四 Agent · 六步开发主线 · 三种过程档位 · 可选发布附加流程
      - shape: 3
        slot: agent-1
        text: |-
          A1 计划与统管
          判断风险 → 选择过程档位 → 维护门禁
      - shape: 5
        slot: agent-2
        text: |-
          A2 需求
          目标 → 场景 → Spec / 原型
      - shape: 7
        slot: agent-3
        text: |-
          A3 开发
          契约 → RED → 实现
      - shape: 9
        slot: agent-4
        text: |-
          A4 质量
          评审 · 验证 · BUG 闭环
      - shape: 32
        slot: phase-6
        text: 完成 Complete
      - shape: 33
        slot: phase-6-pdca
        text: Evidence

  - number: 5
    title: 六项开发原则
    template_slide: 4
    updates:
      - shape: 1
        slot: title
        text: 六项开发原则
    principles:
      - number: "01"
        title: 用户价值先行
        description: 先确认可见结果、边界和不做什么
      - number: "02"
        title: 风险适配，保护存量
        description: 先锁定旧行为与变更边界；风险越高验证越深
      - number: "03"
        title: 契约优先
        description: 先定义公共边界、不变量和失败语义
      - number: "04"
        title: 测试先行
        description: 从相关失败测试开始，再写最小实现
      - number: "05"
        title: 人做判断
        description: 人决定目标、验收、取舍和最终接受
      - number: "06"
        title: 证据闭环
        description: 自动门禁绑定输入、日志和当前候选

  - number: 6
    title: 工程规则
    template_slide: 5
    updates:
      - shape: 3
        slot: rule-1
        text: |-
          需求先确认
          先说清用户看得见的结果；UI 变化再确认原型
      - shape: 5
        slot: rule-2
        text: |-
          影响链先行
          锁定文件、符号、调用边、受保护测试和副作用预算
      - shape: 7
        slot: rule-3
        text: |-
          TDD
          先看到相关测试失败，再写最小实现
      - shape: 9
        slot: rule-4
        text: |-
          硬门禁
          API 契约与适用的 P0 E2E 必须通过
      - shape: 11
        slot: rule-5
        text: |-
          根因分析
          修 BUG 前先取得失败证据，写出可证伪假设
      - shape: 13
        slot: rule-6
        text: |-
          系统化解决
          修根因、补测试、查同类问题，不遮蔽症状
      - shape: 15
        slot: rule-7
        text: |-
          提交节奏
          按纵向工作包或 Capability 提交，不按对话次数
      - shape: 17
        slot: rule-8
        text: |-
          备份机制
          删除、回退或迁移前先 dry-run 并备份

  - number: 7
    title: 验证职责分层
    template_slide: 6
    updates:
      - shape: 1
        slot: title
        text: 验证职责分层
      - shape: 2
        slot: subtitle
        text: 六项原则落地时，让人、AI 和自动化各自承担合适职责
      - shape: 5
        slot: requirement-vv
        text: |-
          人确认需求与验收
          目标、边界、取舍和最终接受由人决定
      - shape: 8
        slot: design-vv
        text: |-
          AI 辅助设计评审
          检查影响与负向保证；附带变更只能由人批准
      - shape: 11
        slot: implementation-vv
        text: |-
          自动化取证
          门禁运行器记录命令、输入、日志和结果

  - number: 8
    title: 原则落地：三次回看
    template_slide: 7
    updates:
      - shape: 1
        slot: title
        text: 原则落地：三次回看
      - shape: 2
        slot: subtitle
        text: 核心理念前置到开发停止点；发现偏差就回到上一份承诺
      - shape: 4
        slot: responsibility-1
        text: |-
          开发前：目标与验收
          结果可见吗？边界合理吗？错误能恢复吗？
      - shape: 6
        slot: responsibility-2
        text: |-
          实现前：风险与契约
          旧行为、调用边、副作用和禁止范围锁定了吗？
      - shape: 8
        slot: responsibility-3
        text: |-
          完成前：测试与证据
          受保护测试仍完整吗？实际变化超出预算了吗？
      - shape: 9
        slot: responsibility-summary
        text: 人负责判断，AI 辅助分析，自动化提供证据；三者不能互相替代

  - number: 9
    title: Agent 层
    template_slide: 8
    updates:
      - shape: 2
        slot: section-subtitle
        text: 四个角色 · 一条连续流程 · 风险越高越强调独立
      - shape: 3
        slot: section-note
        text: Orchestrator + 需求 + 开发 + 质量；轻量档可由一个 Agent 连续完成

  - number: 10
    title: 计划与统管
    template_slide: 9
    updates:
      - shape: 3
        slot: responsibility
        text: |-
          核心职责
          接收变更 → 判断档位与影响 → 生成门禁计划 → 路由角色 → 归档
      - shape: 5
        slot: abilities
        text: |-
          门禁计划
          影响超限先阻断；其余按风险列出检查、顺序与状态
      - shape: 6
        slot: takeaway
        text: 门禁运行器按规范命令执行检查，并绑定输入、日志、结果和证据

  - number: 11
    title: 需求
    template_slide: 10
    updates:
      - shape: 3
        slot: requirement-discovery
        text: |-
          需求探索
          理解目的、约束和成功标准，只问会改变结果的问题
      - shape: 5
        slot: prototype
        text: |-
          交互原型
          只有 UI 行为变化时才做，用来确认“看得见、点得动”
      - shape: 7
        slot: spec
        text: |-
          Spec 与测试设计
          Spec 写不变量与允许差异；独立测试用例用 Test ID 追踪
      - shape: 8
        slot: outputs
        text: 产出：proposal / specs + 测试设计；UI 变化时附可确认原型

  - number: 12
    title: 开发
    template_slide: 11
    updates:
      - shape: 3
        slot: research
        text: |-
          技术预研
          只为未知工具链、外部依赖或高风险行为做可重跑 POC
      - shape: 5
        slot: design
        text: |-
          风险与契约驱动设计
          先锁定变更边界与旧根基；公共边界再定义契约
      - shape: 7
        slot: tdd
        text: |-
          分级 TDD
          Spec → 契约 → RED → 最小实现 → 能力验证
      - shape: 9
        slot: vv
        text: V&V：先得到相关 RED，再让可重放证据说话
      - shape: 10
        slot: flow
        text: 影响与预算 → 受保护测试 + RED → 最小实现 → 实际差异复扫
      - shape: 11
        slot: takeaway
        text: 人确定验收和取舍，AI 完成调研与实现，门禁记录结果

  - number: 13
    title: 质量
    template_slide: 12
    updates:
      - shape: 3
        slot: design-review
        text: |-
          设计评审
          对照文件、符号、调用边、隐性依赖和副作用预算
      - shape: 5
        slot: ui-review
        text: |-
          UI 评审
          只有 UI 变化时检查视觉、交互、响应式和无障碍
      - shape: 7
        slot: code-quality
        text: |-
          代码质量
          越界复扫 + 受保护测试 + diff 评审 + API 契约
      - shape: 9
        slot: bug-loop
        text: |-
          BUG 修复
          失败证据 → 根因假设 → 系统修复 → 回归 → 同类扫描

  - number: 14
    title: 贯穿案例：订单规则升级
    track: deep-dive
    template_slide: 25
    updates:
      - {shape: 0, slot: section-label, text: "深入学习 · 案例"}
      - {shape: 1, slot: title, text: "贯穿案例：订单规则升级"}
      - {shape: 2, slot: subtitle, text: "历史订单服务增加新折扣，同时必须保护旧客户端、消息与结算结果"}
      - {shape: 4, slot: card-1, text: "需求\n会员订单支持分级折扣，旧订单结果不变"}
      - {shape: 6, slot: card-2, text: "存量\nREST、消息消费者和定时结算都依赖订单模型"}
      - {shape: 8, slot: card-3, text: "风险\n金额语义、序列化兼容和重复消费可能变化"}
      - {shape: 10, slot: card-4, text: "目标\n用影响链和证据证明新行为成立且旧根基未削弱"}
      - {shape: 12, slot: footer, text: "贯穿案例 · 后续页面持续引用"}

  - number: 15
    title: 阶段层
    template_slide: 13
    updates:
      - shape: 2
        slot: section-subtitle
        text: 六步开发主线（不是状态枚举）· 连续推进 · 风险决定门禁重量
      - shape: 3
        slot: section-note
        text: "Schema 九 phase：draft / proposal / design / build / verify · retro / release / complete / archived"
        font_sizes: [16]

  - number: 16
    title: 二维风险模型
    track: deep-dive
    template_slide: 25
    updates:
      - {shape: 0, slot: section-label, text: "档位与风险"}
      - {shape: 1, slot: title, text: "二维风险模型"}
      - {shape: 2, slot: subtitle, text: "基础档位与本次变更风险分开表达，影响链等级再决定存量保护深度"}
      - {shape: 4, slot: card-1, text: "基础档位\n产品或能力的长期风险：轻量、标准、严格"}
      - {shape: 6, slot: card-2, text: "变更风险\n本次修改的治理重量：L1—L4"}
      - {shape: 8, slot: card-3, text: "影响等级\n历史代码波及验证深度：L1—L3"}
      - {shape: 10, slot: card-4, text: "最终门禁\n三者与不可降级硬触发取并集"}
      - {shape: 12, slot: footer, text: "三个维度各司其职 · 不再用档位包办一切"}

  - number: 17
    title: 变更风险 L1—L4
    track: deep-dive
    template_slide: 25
    updates:
      - {shape: 0, slot: section-label, text: "档位与风险"}
      - {shape: 1, slot: title, text: "变更风险 L1—L4"}
      - {shape: 2, slot: subtitle, text: "风险越高，设计、独立判断与候选认证越深；开发阶段仍从最小验证开始"}
      - {shape: 4, slot: card-1, text: "L1 低风险\n失败测试、聚焦验证；可在 5 分钟内交付手测"}
      - {shape: 6, slot: card-2, text: "L2 一般风险\n增加相关契约、集成与正式构建"}
      - {shape: 8, slot: card-3, text: "L3 高风险\n完整设计、分层测试、一次独立综合审查"}
      - {shape: 10, slot: card-4, text: "L4 严格风险\n安全、恢复、发布批准与线上观察"}
      - {shape: 12, slot: footer, text: "L1/L2 不虚构形式化人工证据"}

  - number: 18
    title: 硬触发与界面三分类
    track: deep-dive
    template_slide: 25
    updates:
      - {shape: 0, slot: section-label, text: "档位与风险"}
      - {shape: 1, slot: title, text: "硬触发与界面三分类"}
      - {shape: 2, slot: subtitle, text: "认证、迁移等风险不能降级；界面变化不再一律运行关键旅程"}
      - {shape: 4, slot: card-1, text: "至少 L4\n认证、授权、密钥、额度、迁移、不可逆写入"}
      - {shape: 6, slot: card-2, text: "至少 L3\n公共接口、核心算法、跨系统、并发、持久状态机"}
      - {shape: 8, slot: card-3, text: "纯展示 / 一般交互\n运行聚焦界面契约或视觉断言"}
      - {shape: 10, slot: card-4, text: "关键交互 / 业务旅程\n登录、提交、支付、恢复等才强制 P0"}
      - {shape: 12, slot: footer, text: "硬风险不降级 · 界面验证按行为分类"}

  - number: 19
    title: 门禁计划如何生成
    track: deep-dive
    template_slide: 25
    updates:
      - {shape: 0, slot: section-label, text: "门禁机制"}
      - {shape: 1, slot: title, text: "门禁计划如何生成"}
      - {shape: 2, slot: subtitle, text: "门禁计划把风险选择、最晚要求时点、依赖图和历史成本编译成下一步"}
      - {shape: 4, slot: card-1, text: "输入\n基础档位、变更风险、影响等级与硬触发"}
      - {shape: 6, slot: card-2, text: "时点\n开发、合并、发布、观察；昂贵门禁延后"}
      - {shape: 8, slot: card-3, text: "依赖\n前序、覆盖、缓存、候选绑定分别建模"}
      - {shape: 10, slot: card-4, text: "输出\n当前必需门禁、预计耗时、诊断和最小下一步"}
      - {shape: 12, slot: footer, text: "质量要求不降 · 等待发生在真正需要的时点"}

  - number: 20
    title: 门禁状态与下一步
    track: deep-dive
    template_slide: 25
    updates:
      - {shape: 0, slot: section-label, text: "门禁机制"}
      - {shape: 1, slot: title, text: "门禁状态与下一步"}
      - {shape: 2, slot: subtitle, text: "状态不是颜色标签，而是当前输入下可以执行的动作"}
      - {shape: 4, slot: card-1, text: "可运行 / 可复用\n前序完成；或完整执行签名仍新鲜"}
      - {shape: 6, slot: card-2, text: "被覆盖\n更严格门禁已包含同一测试对象，保留来源"}
      - {shape: 8, slot: card-3, text: "延后 / 阻断\n当前时点未到，或前序、候选尚未满足"}
      - {shape: 10, slot: card-4, text: "过期 / 无效\n输入、环境、日志、制品或候选发生变化"}
      - {shape: 12, slot: footer, text: "先执行最小下一步 · 不提前刷全量"}

  - number: 21
    title: 工作包上下文预算
    track: deep-dive
    template_slide: 25
    updates:
      - {shape: 0, slot: section-label, text: "效率治理"}
      - {shape: 1, slot: title, text: "工作包上下文预算"}
      - {shape: 2, slot: subtitle, text: "上下文计划按任务或能力收窄；宽泛目录只报告，不自动递归加载"}
      - {shape: 4, slot: card-1, text: "默认读取\n当前 Spec、相关接口、相关测试、diff 和交接摘要"}
      - {shape: 6, slot: card-2, text: "轻量修复\nL1/L2 只维护 change.md；风险上升再无损提升"}
      - {shape: 8, slot: card-3, text: "任务声明\n在工作包写 reads；宽泛目录不自动展开"}
      - {shape: 10, slot: card-4, text: "预算阻断\n上下文超限先收窄；字符数只是 Token 代理"}
      - {shape: 12, slot: footer, text: "文档与上下文都按当前风险付费"}

  - number: 22
    title: 活动状态与证据索引
    track: deep-dive
    template_slide: 25
    updates:
      - {shape: 0, slot: section-label, text: "效率治理"}
      - {shape: 1, slot: title, text: "活动状态与证据索引"}
      - {shape: 2, slot: subtitle, text: "可手测、可发布和质量调整后效率分开测量；不用少测冒充提速"}
      - {shape: 4, slot: card-1, text: "可手测等待\n只计代码完成到开发已验证的关键路径"}
      - {shape: 6, slot: card-2, text: "后续成本\n发布认证、返工和逸出缺陷仍独立报告"}
      - {shape: 8, slot: card-3, text: "样本边界\n54 条记录；5 个 gate 仅 2 样本，p50/p90 仍未知"}
      - {shape: 10, slot: card-4, text: "本仓样本约 71%\n58.4s → 17.2s；低置信度，项目必须重算"}
