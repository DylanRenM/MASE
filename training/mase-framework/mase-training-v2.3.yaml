  - number: 32
    title: 代码评审（code-review）
    updates:
      - shape: 1
        slot: title
        text: 代码评审（code-review）
      - shape: 2
        slot: subtitle
        text: 围绕受影响行为和当前 diff，给出可执行的分级反馈
      - shape: 4
        slot: card-1
        text: |-
          Spec 与契约
          实现是否覆盖受影响行为？错误语义是否一致？
      - shape: 6
        slot: card-2
        text: |-
