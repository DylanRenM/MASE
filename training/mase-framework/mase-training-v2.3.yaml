schema: mase-training/v2
title: MASE v2.3 开发过程框架
source_version: 2.3.0
template:
  path: training/mase-framework/MASE框架培训讲义V1.pptx
  sha256: fcdf4bd0b8fe3adb5316c8dbccf6e70d91b0274857a5f97827709053886fe188
  slides: 37
output: training/mase-framework/MASE框架培训讲义V2.3.pptx
forbidden_claims:
  - 每 20 次对话
  - 人不读需求文档
  - 测试绿灯 = 实现正确
  - GWT 是唯一事实源
  - 整个流水线的唯一真相源
  - 六阶段 · 层层递进
  - cp -r openspec/changes/_template/
  - 所有外部依赖编写验证脚本并跑通
  - 每个功能必须有自动化测试
  - 人不需逐行审阅代码
  - MASE_SOURCE
  - ../MASE
  - 相邻 MASE 源码
  - 六步教学主线
  - 三 Profile
  - Release Overlay
  - Web 验证与 Sandbox
  - UI contract
  - P0 journey
  - P1 regression
  - 保存 seed
  - shrink
  - fixture
  - adapter
  - flaky
  - trace/
slides:
  - number: 1
    title: MASE v2.3 开发过程框架
    updates:
      - shape: 1
        slot: title
        text: MASE v2.3 开发过程框架
      - shape: 2
        slot: subtitle
        text: 四 Agent · 六步开发主线 · 风险自适应 · 契约与证据闭环
      - shape: 3
        slot: brand
        text: MASE (Measures AI Software Engineering) · v2.3.0

  - number: 2
    title: 为什么需要统一框架
    updates:
      - shape: 3
        slot: problem-1
        text: |-
          过程容易失控
          AI 写得快，但需求、设计、代码和测试可能各说各话
      - shape: 5
        slot: problem-2
        text: |-
          小事流程过重
          所有 change 都套完整设计，时间花在仪式而非风险上
      - shape: 7
        slot: problem-3
        text: |-
          完成难以证明
          只说“测过了”不够，需要可重放、会过期的门禁证据
      - shape: 8
        slot: goal
        text: 目标：一套框架 — 风险决定重量，契约说明边界，证据证明完成

  - number: 3
    title: 框架全景
    updates:
      - shape: 1
        slot: subtitle
        text: 四 Agent · 六步开发主线 · 三种过程档位 · 可选发布附加流程
      - shape: 3
        slot: agent-1
        text: |-
          A1 计划与统管
          判断风险 → 选择过程档位 → 维护门禁
      - shape: 5
        slot: agent-2
        text: |-
          A2 需求
          目标 → 场景 → Spec / 原型
      - shape: 7
        slot: agent-3
        text: |-
          A3 开发
          契约 → RED → 实现
      - shape: 9
        slot: agent-4
        text: |-
          A4 质量
          评审 · 验证 · BUG 闭环
      - shape: 32
        slot: phase-6
        text: 完成 Complete
      - shape: 33
        slot: phase-6-pdca
        text: Evidence

  - number: 4
    title: 六项开发原则
    updates:
      - shape: 1
        slot: title
        text: 六项开发原则
    principles:
      - number: "01"
        title: 用户价值先行
        description: 先确认可见结果、边界和不做什么
      - number: "02"
        title: 风险与影响适配
        description: 先查影响链；低风险轻量走，高风险局部升级
      - number: "03"
        title: 契约优先
        description: 先定义公共边界、不变量和失败语义
      - number: "04"
        title: 测试先行
        description: 从相关失败测试开始，再写最小实现
      - number: "05"
        title: 人做判断
        description: 人决定目标、验收、取舍和最终接受
      - number: "06"
        title: 证据闭环
        description: 自动门禁绑定输入、日志和当前候选

  - number: 5
    title: 工程规则
    updates:
      - shape: 3
        slot: rule-1
        text: |-
          需求先确认
          先说清用户看得见的结果；UI 变化再确认原型
      - shape: 5
        slot: rule-2
        text: |-
          影响链先行
          历史代码先查调用方与隐性依赖，再决定设计深度
      - shape: 7
        slot: rule-3
        text: |-
          TDD
          先看到相关测试失败，再写最小实现
      - shape: 9
        slot: rule-4
        text: |-
          硬门禁
          API 契约与适用的 P0 E2E 必须通过
      - shape: 11
        slot: rule-5
        text: |-
          根因分析
          修 BUG 前先取得失败证据，写出可证伪假设
      - shape: 13
        slot: rule-6
        text: |-
          系统化解决
          修根因、补测试、查同类问题，不遮蔽症状
      - shape: 15
        slot: rule-7
        text: |-
          提交节奏
          按纵向工作包或 Capability 提交，不按对话次数
      - shape: 17
        slot: rule-8
        text: |-
          备份机制
          删除、回退或迁移前先 dry-run 并备份

  - number: 6
    title: 验证职责分层
    updates:
      - shape: 1
        slot: title
        text: 验证职责分层
      - shape: 2
        slot: subtitle
        text: 六项原则落地时，让人、AI 和自动化各自承担合适职责
      - shape: 5
        slot: requirement-vv
        text: |-
          人确认需求与验收
          目标、边界、取舍和最终接受由人决定
      - shape: 8
        slot: design-vv
        text: |-
          AI 辅助设计评审
          检查遗漏、矛盾、风险和替代方案；人拍板
      - shape: 11
        slot: implementation-vv
        text: |-
          自动化取证
          门禁运行器记录命令、输入、日志和结果

  - number: 7
    title: 原则落地：三次回看
    updates:
      - shape: 1
        slot: title
        text: 原则落地：三次回看
      - shape: 2
        slot: subtitle
        text: 核心理念前置到开发停止点；发现偏差就回到上一份承诺
      - shape: 4
        slot: responsibility-1
        text: |-
          开发前：目标与验收
          结果可见吗？边界合理吗？错误能恢复吗？
      - shape: 6
        slot: responsibility-2
        text: |-
          实现前：风险与契约
          影响链清楚吗？公共边界、失败语义和取舍定义了吗？
      - shape: 8
        slot: responsibility-3
        text: |-
          完成前：测试与证据
          测试追踪到 Spec 吗？证据绑定当前候选吗？
      - shape: 9
        slot: responsibility-summary
        text: 人负责判断，AI 辅助分析，自动化提供证据；三者不能互相替代

  - number: 8
    title: Agent 层
    updates:
      - shape: 2
        slot: section-subtitle
        text: 四个角色 · 一条连续流程 · 风险越高越强调独立
      - shape: 3
        slot: section-note
        text: Orchestrator + 需求 + 开发 + 质量；轻量档可由一个 Agent 连续完成

  - number: 9
    title: 计划与统管
    updates:
      - shape: 3
        slot: responsibility
        text: |-
          核心职责
          接收变更 → 判断档位与影响 → 生成门禁计划 → 路由角色 → 归档
      - shape: 5
        slot: abilities
        text: |-
          门禁计划
          影响超限先阻断；其余按风险列出检查、顺序与状态
      - shape: 6
        slot: takeaway
        text: 门禁运行器按规范命令执行检查，并绑定输入、日志、结果和证据

  - number: 10
    title: 需求
    updates:
      - shape: 3
        slot: requirement-discovery
        text: |-
          需求探索
          理解目的、约束和成功标准，只问会改变结果的问题
      - shape: 5
        slot: prototype
        text: |-
          交互原型
          只有 UI 行为变化时才做，用来确认“看得见、点得动”
      - shape: 7
        slot: spec
        text: |-
          Spec 与测试设计
          Spec 写行为与允许差异；独立测试用例用 Test ID 追踪
      - shape: 8
        slot: outputs
        text: 产出：proposal / specs + 测试设计；UI 变化时附可确认原型

  - number: 11
    title: 开发
    updates:
      - shape: 3
        slot: research
        text: |-
          技术预研
          只为未知工具链、外部依赖或高风险行为做可重跑 POC
      - shape: 5
        slot: design
        text: |-
          风险与契约驱动设计
          先做影响链分析；公共边界再定义输入、输出、不变量与错误
      - shape: 7
        slot: tdd
        text: |-
          分级 TDD
          Spec → 契约 → RED → 最小实现 → 能力验证
      - shape: 9
        slot: vv
        text: V&V：先得到相关 RED，再让可重放证据说话
      - shape: 10
        slot: flow
        text: 影响分析 → 契约与失败测试 → 最小实现 → 实际差异复扫
      - shape: 11
        slot: takeaway
        text: 人确定验收和取舍，AI 完成调研与实现，门禁记录结果

  - number: 12
    title: 质量
    updates:
      - shape: 3
        slot: design-review
        text: |-
          设计评审
          对照调用方、隐性依赖、受影响 Spec 与契约，检查遗漏
      - shape: 5
        slot: ui-review
        text: |-
          UI 评审
          只有 UI 变化时检查视觉、交互、响应式和无障碍
      - shape: 7
        slot: code-quality
        text: |-
          代码质量
          实际差异复扫 + diff 评审 + API 契约 + 风险检查
      - shape: 9
        slot: bug-loop
        text: |-
          BUG 修复
          失败证据 → 根因假设 → 系统修复 → 回归 → 同类扫描

  - number: 13
    title: 阶段层
    updates:
      - shape: 2
        slot: section-subtitle
        text: 六步开发主线（不是状态枚举）· 连续推进 · 风险决定门禁重量
      - shape: 3
        slot: section-note
        text: "Schema 九 phase：draft / proposal / design / build / verify · retro / release / complete / archived"
        font_sizes: [16]

  - number: 14
    title: 需求 Proposal
    updates:
      - shape: 3
        slot: discovery
        text: |-
          需求探索
          确认可观察目标、约束、成功标准和不做什么
      - shape: 5
        slot: prototype
        text: |-
          交互原型
          产品有 UI 且本 change 修改 UI 时，用原型确认核心操作
      - shape: 7
        slot: scenarios
        text: |-
          验收场景
          Given / When / Then 表达典型、边界和错误路径，不机械穷举
      - shape: 9
        slot: vv
        text: |-
          V&V：人审阅目标与关键场景
          Spec 是验收行为来源；原型帮助确认 UI，但不能反向发明需求
      - shape: 10
        slot: outputs
        text: 产出：proposal / specs；有 UI 变化时附原型  |  决策：基础过程档位

  - number: 15
    title: 风险分诊与技术预研
    updates:
      - shape: 1
        slot: title
        text: 风险分诊与技术预研
      - shape: 3
        slot: lite
        text: |-
          轻量档（Lite）
          例如：文档、小型本地工具；走最短路径和相关测试
      - shape: 5
        slot: standard
        text: |-
          标准档（Standard）
          例如：UI、文件、外部依赖、并发或持久化
      - shape: 7
        slot: strict
        text: |-
          严格档（Strict）
          例如：鉴权、支付、监管、密钥或不可逆迁移
      - shape: 9
        slot: escalation
        text: |-
          能力局部升级
          能力命中高风险时只加深该能力，不能删除硬门禁
      - shape: 10
        slot: outputs
        text: 产出：过程档位 + L1 / L2 / L3 影响等级 + 门禁计划

  - number: 16
    title: 按风险做设计
    updates:
      - shape: 1
        slot: title
        text: 按风险做设计
      - shape: 4
        slot: architecture
        text: architecture.md
      - shape: 5
        slot: architecture-detail
        text: 标准 / 严格档：架构、模块边界、关键取舍
      - shape: 8
        slot: contract
        text: contract.md
      - shape: 9
        slot: contract-detail
        text: API / 公共协议：输入、输出、不变量、错误语义
      - shape: 13
        slot: tasks-detail
        text: 纵向工作包 + reads + verify
      - shape: 17
        slot: specs-detail
        text: 用户可观察的验收行为与边界
      - shape: 20
        slot: self-review
        text: 风险自检
      - shape: 21
        slot: self-review-detail
        text: 调用方和隐性依赖查全了吗？契约、回滚和降级一致吗？
      - shape: 23
        slot: vv
        font_sizes: [20, 13]
        text: |-
          V&V：设计深度由风险决定
          轻量档不强制完整设计；复杂模型或迁移才局部加深
      - shape: 24
        slot: exit
        text: 设计被后续任务和测试使用，才有价值

  - number: 17
    title: 构建 Build
    updates:
      - shape: 3
        slot: step-1
        text: |-
          先写契约测试
          Spec → 前置 / 后置 / 不变量 → RED
      - shape: 5
        slot: step-2
        text: |-
          最小实现
          只写让当前失败转绿的必要代码
      - shape: 7
        slot: step-3
        text: |-
          微循环
          相关 unit / contract：红 → 绿 → 重构
      - shape: 9
        slot: step-4
        text: |-
          能力验证
          实际差异复扫；按影响等级运行相关集成或全链路测试
      - shape: 11
        slot: step-5
        text: |-
          评审与安全
          风险命中才加安全、回滚或独立评审
      - shape: 13
        slot: vv
        font_sizes: [18, 11]
        text: "V&V：测试通过 = 检查已满足；仍要对照 Spec\n"
      - shape: 14
        slot: exit
        text: 能力验证通过后再提交

  - number: 18
    title: 验证 Verify
    updates:
      - shape: 3
        slot: bug-loop
        text: |-
          BUG 修复闭环
          失败证据 → 可证伪根因 → 系统修复 → 回归测试 → 同类扫描
      - shape: 4
        slot: principles
        text: 原则：不从猜测改代码 · 不遮蔽症状 · 不漏掉同类风险
      - shape: 5
        slot: tools
        text: 工具：缺陷修复流程 + 相关门禁运行器；三次错误假设后停止并补证据

  - number: 19
    title: 复盘 Retro
    updates:
      - shape: 3
        slot: collect
        text: |-
          收集
          本轮失败证据、评审意见、最小反例和门禁日志
      - shape: 5
        slot: analyze
        text: |-
          分析
          高发 BUG、测试盲区、证据 stale 原因和流程短板
      - shape: 7
        slot: improve
        text: |-
          改进
          更新规则、模板、测试或 gate；不把经验只留在聊天里
      - shape: 8
        slot: takeaway
        text: 重大、重复或可复用的问题才沉淀；小事不强制写复盘报告

  - number: 20
    title: 完成
    updates:
      - shape: 1
        slot: title
        text: 完成
      - shape: 3
        slot: step-1
        text: |-
          确认开发候选稳定
          影响复扫、任务、相关门禁和人工确认都完成
      - shape: 5
        slot: step-2
        text: |-
          候选冻结
          固定代码、影响产物与输入摘要；相关变化使证据过期
      - shape: 7
        slot: step-3
        text: |-
          最终验证
          门禁运行器对冻结候选跑一次适用全量测试
      - shape: 9
        slot: step-4
        text: |-
          发布时启用附加流程
          仅在打包、发布、部署、线上验证或恢复时启用
      - shape: 11
        slot: footer
        text: 候选 → 制品 → 目标 → 线上 → 观察
        font_sizes: [13]

  - number: 21
    title: 证据新鲜度闭环
    updates:
      - shape: 0
        slot: section-label
        text: 证据机制
      - shape: 1
        slot: title
        text: 证据新鲜度闭环
      - shape: 3
        slot: input-number
        text: 输入
        font_sizes: [24]
      - shape: 4
        slot: input-title
        text: 绑定检查范围
      - shape: 5
        slot: input-detail
        text: Spec、影响链、代码、测试、配置和候选
      - shape: 7
        slot: run-number
        text: 执行
        font_sizes: [24]
      - shape: 8
        slot: run-title
        text: 执行规范命令
      - shape: 9
        slot: run-detail
        text: 执行规范命令并保存完整日志
      - shape: 11
        slot: evidence-number
        text: 证据
        font_sizes: [24]
      - shape: 12
        slot: evidence-title
        text: 记录可重放结果
      - shape: 13
        slot: evidence-detail
        text: 记录结果、摘要、制品和执行环境
      - shape: 15
        slot: freshness-number
        text: 新鲜度
        font_sizes: [24]
      - shape: 16
        slot: freshness-title
        text: 变化即重新验证
      - shape: 17
        slot: freshness-detail
        text: 输入变化即过期，必须重新验证

  - number: 22
    title: 需求到证据的追踪链
    updates:
      - shape: 0
        slot: section-label
        text: 追踪机制
      - shape: 1
        slot: title
        text: 需求到证据的追踪链
      - shape: 2
        slot: subtitle
        text: 行为留在 Spec；可执行用例独立维护；通过稳定 ID 关联
      - shape: 4
        slot: spec
        text: |-
          Spec 场景
          用户可观察行为、边界、错误与验收条件
      - shape: 6
        slot: contract-test
        text: |-
          测试设计
          Test ID、测试层级、数据与预期结果
      - shape: 8
        slot: implementation-evidence
        text: |-
          可执行测试与证据
          测试代码独立维护；门禁记录当前结果
      - shape: 9
        slot: trace
        text: Spec ID → Test ID → selector → 门禁证据  |  任一变化都可追踪

  - number: 23
    title: 项目结构与框架边界
    updates:
      - shape: 1
        slot: title
        text: 项目结构与框架边界
      - shape: 5
        slot: src-detail
        text: 产品仓库自有源码；不进入 MASE 框架仓库
      - shape: 9
        slot: tests-detail
        text: 产品仓库自有测试、测试数据与适配器
      - shape: 11
        slot: change-dir
        text: .mase/
      - shape: 12
        slot: change-label
        text: 门禁证据
      - shape: 13
        slot: change-detail
        text: .mase/gates.yaml · tests.yaml · evidence · baseline（Brownfield）
      - shape: 15
        slot: mase-dir
        text: openspec
      - shape: 16
        slot: mase-label
        text: 变更事实
      - shape: 17
        slot: mase-detail
        text: proposal · specs · tasks · mase-state.yaml + framework_contract
      - shape: 18
        slot: rules
        text: 边界：产品独立仓库 | 已安装 CLI + 版本化 Schema | 框架用临时采用项目自测

  - number: 24
    title: Skills 矩阵
    updates:
      - shape: 3
        slot: requirements
        text: |-
          需求阶段
          brainstorming
