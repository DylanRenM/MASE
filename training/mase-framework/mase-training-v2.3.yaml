      - shape: 8
        slot: card-3
        text: |-
          问题驱动复审
          首轮无异议即结束；有问题、候选变化或证据失效时继续复审
      - shape: 10
        slot: card-4
        text: |-
          结构化反馈
          标明严重级别、证据、影响和最小修复方向

  - number: 33
    title: 安全评审（security-review）
    updates:
      - shape: 1
        slot: title
        text: 安全评审（security-review）
      - shape: 2
        slot: subtitle
        text: 由风险触发，不是每个标准档 change 都做深度扫描
      - shape: 4
        slot: card-1
        text: |-
          触发条件
          不可信输入、归档、鉴权、支付、密钥或迁移
      - shape: 6
        slot: card-2
        text: |-
          输入与权限
          注入、越权、租户隔离、资源上限和失败原子性
      - shape: 8
        slot: card-3
        text: |-
          密钥与日志
          凭据不落盘、不回显；证据日志必须脱敏
      - shape: 10
        slot: card-4
        text: |-
          迁移与回滚
          先 dry-run、备份和分阶段切换，再执行不可逆动作

