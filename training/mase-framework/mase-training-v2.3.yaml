  - number: 25
    title: 需求澄清（brainstorming）
    updates:
      - shape: 1
        slot: title
        text: 需求澄清（brainstorming）
      - shape: 2
        slot: subtitle
        text: 把“想做什么”变成团队可以验收的结果
      - shape: 4
        slot: card-1
        text: |-
          用户目标
          先理解为什么做、谁会使用、什么结果有价值
      - shape: 6
        slot: card-2
        text: |-
          可见结果
          用操作、输出和错误行为描述成功，不只列功能名
      - shape: 8
        slot: card-3
        text: |-
          约束与风险
          技术栈、时间、合规、不可信输入和不可逆操作
      - shape: 10
        slot: card-4
        text: |-
          批量澄清
          只问会改变验收结果的问题，减少来回打断

  - number: 26
    title: 交互原型（frontend-skill）
    updates:
      - shape: 1
        slot: title
        text: 交互原型（frontend-skill）
      - shape: 2
        slot: subtitle
        text: 只在 UI 行为变化时使用，让需求“看得见、点得动”
      - shape: 4
        slot: card-1
        text: |-
          先看参考
          优先沿用用户给定页面、设计系统和现有交互
      - shape: 6
        slot: card-2
        text: |-
          确认核心流程
          覆盖用户真正要操作的主路径，不追求所有装饰细节
      - shape: 8
        slot: card-3
        text: |-
          异常也要可见
          空状态、失败提示、权限不足和恢复动作要能演示
      - shape: 10
        slot: card-4
        text: |-
          原型不是需求源
          冲突时回到用户目标和 Spec，不让原型自行加需求

  - number: 27
    title: 任务与上下文规划
    updates:
      - shape: 1
        slot: title
        text: 任务与上下文规划
      - shape: 2
        slot: subtitle
        text: 任务拆成可验收工作包；上下文只带真正需要的信息
      - shape: 4
        slot: card-1
        text: |-
          纵向任务
          每项从 Spec 到测试和实现，交付一个可验证结果
      - shape: 6
        slot: card-2
        text: |-
          依赖与并行
          先标出真实依赖，再并行没有共享写入的工作
      - shape: 8
        slot: card-3
        text: |-
          上下文路由
          默认只读当前 Spec、相关接口与测试、diff 和交接摘要
      - shape: 10
        slot: card-4
        text: |-
          产出 tasks.md
          每项写清 reads 与 verify，避免“做完但无法验收”

  - number: 28
    title: 契约优先（Contract First）
    updates:
      - shape: 1
        slot: title
        text: 契约优先（Contract First）
      - shape: 2
        slot: subtitle
        text: 先把边界说清楚，再把它变成失败测试
      - shape: 4
        slot: card-1
        text: |-
          来自 Spec
          契约只提炼已确认的行为，不凭空发明默认值或幂等性
      - shape: 6
        slot: card-2
        text: |-
          四类内容
          前置条件、后置结果、不变量和错误响应
      - shape: 8
        slot: card-3
        text: |-
          公共边界必做
          API 和公共协议必须做契约测试；内部函数按风险
      - shape: 10
        slot: card-4
        text: |-
          建立追踪
          Spec ID → Contract ID → Test ID，失败时知道哪条承诺没兑现

  - number: 29
    title: 设计评审（design-review）
    updates:
      - shape: 1
        slot: title
        text: 设计评审（design-review）
      - shape: 2
        slot: subtitle
        text: 评审重点随风险变化，不让所有项目都背同样重量
      - shape: 4
        slot: card-1
        text: |-
          风险匹配
          轻量档看 diff；标准档看能力边界；严格档做独立评审
      - shape: 6
        slot: card-2
        text: |-
          需求一致
          设计是否覆盖受影响 Spec？有没有多做或漏做？
      - shape: 8
        slot: card-3
        text: |-
          契约与失败
          API、状态机、并发和资源生命周期是否说清异常语义？
      - shape: 10
        slot: card-4
        text: |-
          回滚与恢复
          迁移、配置、数据和外部依赖出错时如何回到安全状态？

  - number: 30
    title: 分级 TDD 与属性测试
    updates:
      - shape: 1
        slot: title
        text: 分级 TDD 与属性测试
      - shape: 2
        slot: subtitle
        text: 先跑相关检查，能力边界再扩展，最后只验证冻结候选
      - shape: 4
        slot: card-1
        text: |-
          Micro 微循环
          当前 unit / contract：确认 RED → 最小实现 → 重构
      - shape: 6
        slot: card-2
        text: |-
          属性测试
          复杂输入、解析、数值边界或状态机命中时使用
      - shape: 8
        slot: card-3
        text: |-
          可重放失败
          保存随机种子、工具版本、重放命令和收缩后的最小反例
      - shape: 10
        slot: card-4
        text: |-
          补充而不替代
          属性测试补充确定性样例，不能替代 Spec 和典型回归测试

