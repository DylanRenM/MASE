name: macOS MVP Design L1 POC

on:
  workflow_dispatch:
  push:
    branches:
      - "feat/macos-english-listening-mvp"
    paths:
      - ".github/workflows/macos-mvp-design-l1.yml"
      - "openspec/changes/macos-english-listening-mvp/poc/**"

permissions:
  contents: read

concurrency:
  group: macos-mvp-design-l1-${{ github.ref }}
  cancel-in-progress: true

jobs:
  feasibility:
    name: Xcode and native framework POC
    runs-on: macos-15
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Verify full Xcode toolchain
        run: |
          set -euo pipefail
          xcode-select -p
          xcodebuild -version
          xcodebuild -showsdks
          swift --version
          test -x "$(xcrun --find xctest)"

      - name: Resolve locked dependencies
        working-directory: openspec/changes/macos-english-listening-mvp/poc
        run: swift package resolve

      - name: Build with the Xcode-selected Swift toolchain
        working-directory: openspec/changes/macos-english-listening-mvp/poc
        run: swift build --build-tests

      - name: Run Design L1 feasibility checks
        working-directory: openspec/changes/macos-english-listening-mvp/poc
        run: swift run morerduo-poc
