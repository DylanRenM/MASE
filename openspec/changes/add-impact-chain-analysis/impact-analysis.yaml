  - new changes begin with undecided impact classification
  - analysis-stage gates precede later stages when impact analysis applies
  side_effect_isolation: temporary project roots; no production or Pilot files are
    read or written
  normalization:
  - temporary paths and timestamps are asserted structurally
recovery:
  strategy: revert the impact-chain framework change and regenerate IDE adapters/training
    deck
  data_compatibility: existing states remain readable because impact_analysis is optional;
    newly generated fields can be removed on rollback
  stop_conditions:
  - existing API contract or GatePlan regression
  - candidate freeze becomes stale immediately after creation
  - framework distribution or repository-boundary audit fails
