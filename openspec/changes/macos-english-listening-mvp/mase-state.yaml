# MASE OpenSpec 配置
schema: "mase-project/v1"

project_type:
  has_ui: true
  ui_platform: "macOS 13+ / SwiftUI"

phase: build

delivery:
  repository_mode: "local-only"
  build_mode: "swiftpm-app-bundle"
  e2e_driver: "apple-accessibility"
  distribution: "local-ad-hoc"

gates:
  proposal: passed
  design_l1: passed
  design_l2_review: passed
  build_entry: passed

capabilities:
  - document-ingestion
  - english-content-filtering
  - speech-playback-control
  - active-reading-timer
  - reading-progress
  - source-file-monitoring
  - session-lifecycle
