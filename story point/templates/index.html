<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StoryPoint</title>
    <style>
        /* ── 基础系统 ──────────────────────────────── */
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        :root {
            --accent: #4361ee;
            --accent-dim: #3a56d4;
            --accent-bg: #eef0ff;
            --text: #1a1a2e;
            --text-muted: #8e8e9a;
            --divider: #eaeaef;
            --surface: #fafafa;
            --surface-hover: #f2f2f7;
            --radius: 6px;
            --font: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
            --mono: "SF Mono", "Cascadia Code", "Consolas", monospace;
        }
        body {
            font-family: var(--font);
            color: var(--text);
            background: #fff;
            line-height: 1.5;
            -webkit-font-smoothing: antialiased;
        }

        /* ── 头部 ──────────────────────────────────── */
        .header {
            display: flex; align-items: center; justify-content: space-between;
            padding: 14px 24px; border-bottom: 1px solid var(--divider);
            height: 50px;
        }
        .header-brand { font-size: 1.125rem; font-weight: 700; letter-spacing: -0.02em; }
        .header-status { display: flex; align-items: center; gap: 8px; font-size: 0.8rem; color: var(--text-muted); }
        .status-dot { width: 8px; height: 8px; border-radius: 50%; background: #c0c0c8; }
        .status-dot.active { background: #34c759; }

        /* ── 主布局 ────────────────────────────────── */
        .layout { display: grid; grid-template-columns: 1fr 5px var(--panel-width, 380px); height: calc(100vh - 50px); }
        .workspace { padding: 28px 32px 40px; max-width: 720px; overflow-y: auto; }
        .panel-divider {
            background: var(--divider);
            cursor: col-resize;
            width: 5px;
            height: 100%;
            user-select: none;
            transition: background 0.15s;
            z-index: 10;
        }
        .panel-divider:hover, .panel-divider.active { background: var(--accent); }
        .result-panel {
            background: var(--surface);
            overflow-y: auto;
        }

        /* ── 分区标题 ──────────────────────────────── */
        .section-title {
            font-size: 0.75rem; font-weight: 600; text-transform: uppercase;
            letter-spacing: 0.05em; color: var(--text-muted); margin-bottom: 10px;
        }
        .section-divider { border: none; border-top: 1px solid var(--divider); margin: 24px 0; }

        /* ── 表单 ──────────────────────────────────── */
        .field { margin-bottom: 12px; }
        .field-label { display: block; font-size: 0.8rem; font-weight: 500; color: var(--text-muted); margin-bottom: 4px; }
        .field-input, .field-textarea {
            width: 100%; padding: 9px 12px; border: 1px solid var(--divider);
            border-radius: var(--radius); font-size: 0.875rem; font-family: var(--font);
            color: var(--text); background: #fff; outline: none; transition: border-color 0.15s;
        }
        .field-input:focus, .field-textarea:focus { border-color: var(--accent); }
        .field-input::placeholder, .field-textarea::placeholder { color: #c0c0c8; }
        .field-textarea { resize: vertical; min-height: 80px; }

        /* ── 按钮 ──────────────────────────────────── */
        .btn {
            display: inline-flex; align-items: center; gap: 5px; padding: 7px 14px;
            border: none; border-radius: var(--radius); font-size: 0.8rem; font-weight: 500;
            font-family: var(--font); cursor: pointer; transition: background 0.15s, color 0.15s;
        }
        .btn-primary { background: var(--accent); color: #fff; }
        .btn-primary:hover { background: var(--accent-dim); }
        .btn-primary:disabled { opacity: 0.4; cursor: not-allowed; }
        .btn-ghost { background: transparent; color: var(--text-muted); border: 1px solid var(--divider); }
        .btn-ghost:hover { background: var(--surface-hover); color: var(--text); }
        .btn-accent { background: transparent; color: var(--accent); }
        .btn-accent:hover { background: var(--accent-bg); }

        /* ── 提醒 ──────────────────────────────────── */
        .alert {
            font-size: 0.8rem; padding: 8px 12px; border-radius: var(--radius); margin-top: 8px;
        }
        .alert-error { background: #fef2f2; color: #991b1b; }
        .alert-info { background: #eff6ff; color: #1e40af; }
        .alert-ok { background: #f0fdf4; color: #166534; }

        /* ── 折叠面板 ──────────────────────────────── */
        .toggle-trigger { font-size: 0.8rem; color: var(--accent); cursor: pointer; user-select: none; transition: color 0.15s; }
        .toggle-trigger:hover { color: var(--accent-dim); }
        .toggle-trigger.muted { color: var(--text-muted); cursor: default; }
        .toggle-panel { overflow: hidden; max-height: 0; opacity: 0; transition: max-height 0.35s ease, opacity 0.25s ease, margin 0.25s ease; }
        .toggle-panel.open { max-height: 600px; opacity: 1; margin-top: 10px; }

        /* ── 表格 ──────────────────────────────────── */
        .data-table { width: 100%; border-collapse: collapse; font-size: 0.8rem; }
        .data-table th, .data-table td { padding: 6px 10px; border-bottom: 1px solid var(--divider); text-align: left; }
        .data-table th { font-weight: 500; color: var(--text-muted); font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.04em; }
        .data-table tr:hover td { background: var(--surface-hover); }
        .data-table tr.clickable { cursor: pointer; }

        /* ── 辅助样式 ──────────────────────────────── */
        .toolbar { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 6px; }
        .text-muted { color: var(--text-muted); font-size: 0.8rem; }
        .hidden { display: none; }

        /* ── 右侧结果面板 ──────────────────────────── */
        .panel-empty { padding: 24px 20px; text-align: center; color: var(--text-muted); font-size: 0.8rem; }
        .panel-content { padding: 20px; }
        .panel-fade { animation: fadeIn 0.25s ease; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

        .result-hero {
            display: flex; align-items: flex-end; gap: 12px; margin-bottom: 14px;
        }
        .result-value {
            font-size: 3rem; font-weight: 700; line-height: 1; color: var(--accent); letter-spacing: -0.03em;
        }
        .result-confidence {
            font-size: 0.75rem; color: var(--text-muted); margin-bottom: 2px;
        }
        .confidence-tag {
            display: inline-block; font-size: 0.75rem; color: var(--text-muted);
            background: #fff; padding: 2px 8px; border-radius: 3px; font-family: var(--mono);
            border: 1px solid var(--divider);
        }

        .panel-section { margin-bottom: 14px; }
        .panel-section-title { font-size: 0.72rem; font-weight: 600; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.04em; margin-bottom: 6px; }
        .panel-text { font-size: 0.78rem; white-space: pre-wrap; word-break: break-word; line-height: 1.6; }

        .batch-summary-row { padding: 6px 0; border-bottom: 1px solid var(--divider); font-size: 0.78rem; }
        .batch-summary-detail { background: #fff; padding: 8px 10px; margin: 4px 0; border-radius: 4px; font-size: 0.76rem; }

        /* ── 质量报告 ────────────────────────────── */
        .quality-report { margin-top: 12px; border-top: 1px dashed var(--divider); padding-top: 10px; }
        .quality-header { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; }
        .quality-score { font-size: 1.5rem; font-weight: 700; font-family: var(--mono); }
        .quality-badge {
            font-size: 0.75rem; font-weight: 500; padding: 2px 8px; border-radius: 3px;
        }
        .quality-pass { background: #f0fdf4; color: #166534; }
        .quality-warn { background: #fefce8; color: #92400e; }
        .quality-fail { background: #fef2f2; color: #991b1b; }
        .quality-issue { font-size: 0.78rem; margin: 4px 0; padding: 4px 8px; border-radius: var(--radius); }
        .quality-issue.warning { background: #fffbeb; color: #92400e; }
        .quality-issue.error { background: #fef2f2; color: #991b1b; }
        .quality-llm { font-size: 0.78rem; margin-top: 8px; color: var(--text-muted); }
        .quality-llm-toggle { font-size: 0.75rem; color: var(--accent); cursor: pointer; user-select: none; }
    </style>
</head>
<body>
    <!-- ── 头部 ────────────────────────────────── -->
    <header class="header">
        <div class="header-brand">StoryPoint</div>
        <div class="header-status">
            <span class="status-dot" id="status-dot"></span>
            <span id="status-text">未加载基准故事</span>
        </div>
    </header>

    <div class="layout">
        <!-- ── 主工作区（左） ────────────────────── -->
        <div class="workspace">
            <div class="section-title">估算新需求</div>
            <div class="field">
                <label class="field-label" for="story-title">故事标题</label>
                <input class="field-input" type="text" id="story-title" placeholder="如：微信扫码登录">
            </div>
            <div class="field">
                <label class="field-label" for="story-desc">故事描述</label>
                <textarea class="field-textarea" id="story-desc" rows="3" placeholder="详细描述功能点、涉及页面、接口、外部依赖等..."></textarea>
            </div>
            <div class="field">
                <label class="field-label" for="story-acceptance">验收标准（可选）</label>
                <textarea class="field-textarea" id="story-acceptance" rows="2" placeholder="Given ...&#10;When ...&#10;Then ..."></textarea>
            </div>
            <button class="btn btn-primary" id="estimate-btn" disabled onclick="doEstimate()">开始估算</button>
            <span class="text-muted hidden" id="estimate-progress" style="margin-left:12px;"></span>

            <hr class="section-divider">

            <div class="section-title">批量估算</div>
            <p class="text-muted" style="margin-bottom:8px;">下载模板，填入多条待估算故事，上传后结果在右侧面板展示。</p>
            <div class="toolbar">
                <button class="btn btn-ghost" onclick="downloadBatchTemplate()">下载模板</button>
                <input type="file" id="batch-file-input" accept=".xlsx,.xls" class="hidden" onchange="handleBatchUpload(this)">
                <button class="btn btn-ghost" onclick="document.getElementById('batch-file-input').click()">上传文件</button>
            </div>
            <div id="batch-status" class="alert alert-info hidden"></div>

            <hr class="section-divider">

            <div class="section-title">基准故事管理</div>
            <div id="baseline-toggle">
                <span id="baseline-toggle-text" class="toggle-trigger muted">暂无基准故事</span>
            </div>
            <div class="toolbar" style="margin-top:6px;">
                <button class="btn btn-ghost" onclick="downloadTemplate()">下载模板</button>
                <input type="file" id="file-input" accept=".xlsx,.xls" class="hidden" onchange="handleUpload(this)">
                <button class="btn btn-ghost" onclick="document.getElementById('file-input').click()">上传Excel</button>
            </div>

            <div id="preview-section" class="hidden" style="margin-top:6px;">
                <div id="preview-content" style="font-size:0.8rem;"></div>
                <div id="quality-report"></div>
                <div class="toolbar" style="margin-top:6px;">
                    <button class="btn btn-accent" id="btn-replace" onclick="confirmBaseline('replace')">全量替换</button>
                    <button class="btn btn-ghost" id="btn-append" onclick="confirmBaseline('append')">追加合并</button>
                </div>
            </div>

            <div id="baseline-status" class="alert alert-info hidden" style="margin-top:6px;"></div>
            <div class="toggle-panel" id="baseline-list-panel">
                <table class="data-table" style="max-height:240px; display:block; overflow-y:auto;">
                    <thead><tr><th>ID</th><th>标题</th><th>描述</th><th>验收标准</th><th>点数</th></tr></thead>
                    <tbody id="baseline-list-body"></tbody>
                </table>
            </div>
        </div>

        <!-- ── 可拖拽分隔线 ───────────────────────── -->
        <div class="panel-divider" id="panel-divider"></div>

        <!-- ── 结果面板（右） ────────────────────── -->
        <div class="result-panel" id="result-panel">
            <div class="panel-empty" id="panel-placeholder">请在上方输入需求并开始估算</div>
            <div class="panel-content hidden" id="panel-content"></div>
        </div>
    </div>

    <script>
        // ── 工具函数 ──────────────────────────────
        function escapeHtml(str) {
            const div = document.createElement('div');
            div.textContent = str;
            return div.innerHTML;
        }

        function showAlert(el, msg, type) {
            el.innerHTML = msg;
            el.className = 'alert alert-' + (type === 'error' ? 'error' : type === 'info' ? 'info' : 'ok');
            el.classList.remove('hidden');
        }

        // ── 头部状态 ──────────────────────────────
        function updateHeaderCount(count) {
            const dot = document.getElementById('status-dot');
            const text = document.getElementById('status-text');
            if (count > 0) { dot.className = 'status-dot active'; text.textContent = count + ' 条基准已加载'; }
            else { dot.className = 'status-dot'; text.textContent = '未加载基准故事'; }
        }

        // ── 模板下载 ──────────────────────────────
        function downloadTemplate() { window.location.href = '/template/download'; }
        function downloadBatchTemplate() { window.location.href = '/batch/template'; }

        // ── 基准故事上传 ──────────────────────────
        const baselineStatus = document.getElementById('baseline-status');

        function handleUpload(input) {
            const file = input.files[0];
            if (!file) return;
            const formData = new FormData();
            formData.append('file', file);
            showAlert(baselineStatus, '正在解析文件...', 'info');

            fetch('/baseline/upload', { method: 'POST', body: formData })
                .then(r => r.json())
                .then(data => {
                    if (data.status === 'ok') showPreview(data);
                    else showAlert(baselineStatus, data.errors.join('; '), 'error');
                })
                .catch(e => showAlert(baselineStatus, '上传失败: ' + e.message, 'error'))
                .finally(() => { input.value = ''; });
        }

        function showPreview(data) {
            let html = '已解析 <b>' + data.rows.length + '</b> 条故事&nbsp;&nbsp;';
            for (const [pt, count] of Object.entries(data.points_distribution)) {
                html += pt + '点×' + count + '&nbsp;';
            }
            document.getElementById('preview-content').innerHTML = html;
            document.getElementById('preview-section').classList.remove('hidden');
            baselineStatus.classList.add('hidden');

            // 渲染合理性评价
            renderQualityReport(data.quality_report);
        }

        function renderQualityReport(qr) {
            const el = document.getElementById('quality-report');
            const btnReplace = document.getElementById('btn-replace');
            const btnAppend = document.getElementById('btn-append');

            if (!qr) { el.innerHTML = ''; return; }

            // 状态标记
            let badgeClass, badgeText, btnDisabled;
            if (!qr.pass) {
                badgeClass = 'quality-fail'; badgeText = '不通过 ✗'; btnDisabled = true;
            } else if (qr.issues && qr.issues.length > 0) {
                badgeClass = 'quality-warn'; badgeText = '通过（有改进空间）'; btnDisabled = false;
            } else {
                badgeClass = 'quality-pass'; badgeText = '通过 ✓'; btnDisabled = false;
            }

            let h = '<div class="quality-report">';
            h += '<div class="quality-header">';
            h += '<span class="quality-score">' + qr.overall_score + '</span>';
            h += '<span class="quality-badge ' + badgeClass + '">' + badgeText + '</span>';
            h += '</div>';

            // 问题列表
            if (qr.issues && qr.issues.length) {
                for (const issue of qr.issues) {
                    const prefix = issue.severity === 'error' ? '✗' : '⚠';
                    h += '<div class="quality-issue ' + issue.severity + '">';
                    h += prefix + ' ' + escapeHtml(issue.message);
                    h += '</div>';
                }
            }

            // LLM 建议（可折叠）
            if (qr.issues_llm) {
                h += '<div class="quality-llm">';
                h += '<span class="quality-llm-toggle" onclick="this.nextElementSibling.classList.toggle(\'hidden\'); this.textContent = this.textContent.startsWith(\'▸\') ? \'▾ LLM 建议\' : \'▸ LLM 建议\';">▾ LLM 建议</span>';
                h += '<div style="margin-top:4px;">' + escapeHtml(qr.issues_llm) + '</div>';
                h += '</div>';
            }

            h += '</div>';
            el.innerHTML = h;

            // 按钮状态
            btnReplace.disabled = btnDisabled;
            btnAppend.disabled = btnDisabled;
            if (btnDisabled) {
                btnReplace.title = '请修正基准故事后重新上传';
                btnAppend.title = '请修正基准故事后重新上传';
            } else {
                btnReplace.title = '';
                btnAppend.title = '';
            }
        }

        function confirmBaseline(action) {
            fetch('/baseline/confirm', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ action })
            })
            .then(r => r.json())
            .then(data => {
                if (data.status === 'ok') {
                    showAlert(baselineStatus, '已加载 ' + data.count + ' 条基准故事', 'ok');
                    document.getElementById('preview-section').classList.add('hidden');
                    document.getElementById('estimate-btn').disabled = false;
                    document.getElementById('file-input').value = '';
                    updateHeaderCount(data.count);
                    loadBaselineList();
                } else {
                    showAlert(baselineStatus, data.errors.join('; '), 'error');
                }
            });
        }

        // ── 基准故事列表 ──────────────────────────
        function loadBaselineList() {
            fetch('/baseline/list')
                .then(r => r.json())
                .then(data => {
                    const toggleText = document.getElementById('baseline-toggle-text');
                    const panel = document.getElementById('baseline-list-panel');
                    const body = document.getElementById('baseline-list-body');
                    if (!data.length) {
                        toggleText.className = 'toggle-trigger muted';
                        toggleText.textContent = '暂无基准故事';
                        toggleText.onclick = null;
                        panel.classList.remove('open');
                        return;
                    }
                    toggleText.className = 'toggle-trigger';
                    toggleText.textContent = '查看 ' + data.length + ' 条已加载基准故事';
                    toggleText.onclick = toggleBaselineList;
                    let html = '';
                    for (const s of data) {
                        html += '<tr><td>' + escapeHtml(s.id) + '</td><td>' + escapeHtml(s.title) + '</td><td style="max-width:200px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">' + escapeHtml(s.description) + '</td><td>' + escapeHtml(s.acceptance_criteria || '') + '</td><td style="font-family:var(--mono);">' + s.points + '</td></tr>';
                    }
                    body.innerHTML = html;
                });
        }

        function toggleBaselineList() {
            const panel = document.getElementById('baseline-list-panel');
            const toggleText = document.getElementById('baseline-toggle-text');
            if (panel.classList.contains('open')) {
                panel.classList.remove('open');
                toggleText.textContent = '查看 ' + toggleText.textContent.match(/\d+/) + ' 条已加载基准故事';
            } else {
                panel.classList.add('open');
                const count = toggleText.textContent.match(/\d+/);
                toggleText.textContent = '收起 ' + (count ? count[0] : '') + ' 条基准故事';
            }
        }

        // ── 单个估算 + 面板渲染 ───────────────────
        function doEstimate() {
            const title = document.getElementById('story-title').value.trim();
            const desc = document.getElementById('story-desc').value.trim();
            const acceptance = document.getElementById('story-acceptance').value.trim();
            if (!title || !desc) return;

            const progress = document.getElementById('estimate-progress');
            progress.textContent = '正在分析...';
            progress.classList.remove('hidden');

            fetch('/estimate', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ title, description: desc, acceptance_criteria: acceptance })
            })
            .then(r => r.json())
            .then(data => {
                progress.classList.add('hidden');
                if (data.status === 'error') {
                    progress.textContent = data.errors.join('; ');
                    return;
                }
                renderSingleResult(data);
            })
            .catch(e => { progress.textContent = e.message; });
        }

        function renderSingleResult(data) {
            const content = document.getElementById('panel-content');
            const placeholder = document.getElementById('panel-placeholder');
            placeholder.classList.add('hidden');
            content.classList.remove('hidden');
            content.className = 'panel-content panel-fade';

            let html = '';

            // 大数 + 置信
            html += '<div class="result-hero">';
            html += '<div class="result-value">' + data.estimate + '</div>';
            html += '<div>';
            html += '<div class="result-confidence">置信区间</div>';
            html += '<span class="confidence-tag">' + data.confidence_min + '–' + data.confidence_max + '</span>';
            if (data.degraded) {
                html += '<div class="alert alert-info" style="margin-top:6px;">LLM 不可用，以下为数值估算结果</div>';
            }
            html += '</div></div>';

            // 拆分建议
            if (data.split_suggestion && data.split_suggestion.suggested) {
                html += '<div class="alert alert-error" style="margin-top:8px;margin-bottom:12px;">' + escapeHtml(data.split_suggestion.message) + '</div>';
            }

            // 依据
            if (data.reasoning) {
                html += '<div class="panel-section">';
                html += '<div class="panel-section-title">估算依据</div>';
                html += '<div class="panel-text">' + escapeHtml(data.reasoning) + '</div>';
                html += '</div>';
            }

            // 参考基准
            if (data.top_matches && data.top_matches.length) {
                html += '<div class="panel-section">';
                html += '<div class="panel-section-title">参考基准</div>';
                html += '<table class="data-table"><tr><th>ID</th><th>标题</th><th>点数</th><th>相似度</th></tr>';
                for (const m of data.top_matches) {
                    html += '<tr><td>' + escapeHtml(m.id) + '</td><td>' + escapeHtml(m.title) + '</td><td style="font-family:var(--mono);">' + m.points + '</td><td style="font-family:var(--mono);">' + m.similarity + '%</td></tr>';
                }
                html += '</table></div>';
            }

            // 复杂度
            if (data.features) {
                html += '<div class="panel-section">';
                html += '<div class="panel-section-title">复杂度特征</div>';
                html += '<table class="data-table"><tr><th>维度</th><th>值</th></tr>';
                const fLabels = {
                    frontend_pages: '前端页面', backend_interfaces: '后端接口',
                    db_change: '数据库变更', external_dependency: '外部依赖',
                    async_processing: '异步处理', transaction_required: '事务一致性',
                    business_branches: '业务分支', permission_control: '权限控制',
                    data_migration: '数据迁移', cache_design: '缓存设计'
                };
                for (const [key, label] of Object.entries(fLabels)) {
                    html += '<tr><td>' + label + '</td><td style="font-family:var(--mono);">' + escapeHtml(String(data.features[key] ?? '-')) + '</td></tr>';
                }
                html += '</table></div>';
            }

            // 风险
            if (data.risk_notes) {
                html += '<div class="alert alert-error">' + escapeHtml(data.risk_notes) + '</div>';
            }

            content.innerHTML = html;
            // 面板滚回顶部
            document.getElementById('result-panel').scrollTop = 0;
        }

        // ── 批量估算 + 面板汇总 ───────────────────
        function handleBatchUpload(input) {
            if (!input.files.length) return;
            const file = input.files[0];
            const status = document.getElementById('batch-status');
            showAlert(status, '正在批量估算，请稍候...', 'info');

            const formData = new FormData();
            formData.append('file', file);

            fetch('/batch/estimate', { method: 'POST', body: formData })
                .then(r => r.json())
                .then(data => {
                    if (data.status === 'error') {
                        showAlert(status, data.errors.join('; '), 'error');
                        return;
                    }
                    showAlert(status, '', 'ok');
                    status.classList.add('hidden');
                    renderBatchResult(data);
                })
                .catch(err => showAlert(status, '批量估算失败: ' + (err.message || err), 'error'))
                .finally(() => { input.value = ''; });
        }

        function renderBatchResult(data) {
            const content = document.getElementById('panel-content');
            const placeholder = document.getElementById('panel-placeholder');
            placeholder.classList.add('hidden');
            content.classList.remove('hidden');
            content.className = 'panel-content panel-fade';

            let html = '<div class="panel-section-title" style="margin-bottom:10px;">批量估算结果（' + data.count + ' 条）</div>';

            // 汇总表
            html += '<table class="data-table"><tr><th>ID</th><th>标题</th><th>点数</th></tr>';
            for (let i = 0; i < data.rows.length; i++) {
                const r = data.rows[i];
                html += '<tr class="clickable" onclick="toggleBatchDetail(' + i + ')">';
                html += '<td>' + escapeHtml(r.id) + '</td>';
                html += '<td>' + escapeHtml(r.title) + '</td>';
                html += '<td style="font-family:var(--mono);">' + r.estimate + '</td>';
                html += '</tr>';
                // 可展开详情行
                html += '<tr id="batch-detail-' + i + '" class="hidden">';
                html += '<td colspan="3"><div class="batch-summary-detail">';
                html += '<b>置信:</b> ' + r.confidence_min + '–' + r.confidence_max + '<br>';
                html += '<b>依据:</b> ' + escapeHtml(r.reasoning || '—') + '<br>';
                html += '<b>风险:</b> ' + escapeHtml(r.risk_notes || '—');
                html += '</div></td></tr>';
            }
            html += '</table>';

            // 下载按钮
            if (data.download_token) {
                html += '<div style="margin-top:16px;">';
                html += '<button class="btn btn-accent" onclick="downloadBatchResult(\'' + data.download_token + '\')">下载 Excel</button>';
                html += '</div>';
            }

            content.innerHTML = html;
            document.getElementById('result-panel').scrollTop = 0;
            // 存储 rows 供展开使用
            content._batchRows = data.rows;
        }

        function toggleBatchDetail(idx) {
            const row = document.getElementById('batch-detail-' + idx);
            if (row.classList.contains('hidden')) row.classList.remove('hidden');
            else row.classList.add('hidden');
        }

        function downloadBatchResult(token) {
            window.location.href = '/batch/download?token=' + encodeURIComponent(token);
        }

        // ── 面板拖拽调整宽度 ───────────────────────
        (function() {
            const divider = document.getElementById('panel-divider');
            const layout = document.querySelector('.layout');
            let isDragging = false;
            let panelRatio = 380 / window.innerWidth;

            divider.addEventListener('mousedown', (e) => {
                isDragging = true;
                divider.classList.add('active');
                document.body.style.cursor = 'col-resize';
                document.body.style.userSelect = 'none';
                e.preventDefault();
            });

            document.addEventListener('mousemove', (e) => {
                if (!isDragging) return;
                const rect = layout.getBoundingClientRect();
                const panelWidth = rect.right - e.clientX;
                panelRatio = panelWidth / window.innerWidth;
                const clamped = Math.max(0.25, Math.min(0.5, panelRatio));
                layout.style.setProperty('--panel-width', (clamped * window.innerWidth) + 'px');
            });

            document.addEventListener('mouseup', () => {
                if (!isDragging) return;
                isDragging = false;
                divider.classList.remove('active');
                document.body.style.cursor = '';
                document.body.style.userSelect = '';
            });

            window.addEventListener('resize', () => {
                const clamped = Math.max(0.25, Math.min(0.5, panelRatio));
                layout.style.setProperty('--panel-width', (clamped * window.innerWidth) + 'px');
            });
        })();

        // ── 初始化 ────────────────────────────────
        const initialStoryCount = {{ story_count }};
        if (initialStoryCount > 0) {
            document.getElementById('estimate-btn').disabled = false;
            updateHeaderCount(initialStoryCount);
        }
        loadBaselineList();
    </script>
</body>
</html>
