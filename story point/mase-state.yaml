capabilities:
  - id: "C1"
    name: "Excel模板下载与解析"
    description: "生成带数据验证的模板Excel，解析用户上传的基线故事"
    core_modules: ["utils/excel_handler.py", "core/validator.py"]
  - id: "C2"
    name: "基准故事管理与向量化"
    description: "SQLite存储、FAISS向量索引、全量替换/追加合并"
    core_modules: ["db/models.py", "db/vector_store.py", "core/embedding.py", "services/baseline_service.py"]
  - id: "C3"
    name: "故事点估算引擎"
    description: "Top3余弦相似度检索、加权平均、斐波那契舍入、LLM裁决与降级"
    core_modules: ["core/estimator.py", "core/reporter.py", "services/estimate_service.py"]
  - id: "C4"
    name: "Web交互界面"
    description: "Flask路由、Jinja2模板渲染、AJAX交互、历史记录"
    core_modules: ["app.py", "templates/"]

