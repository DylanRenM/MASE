schema: mase-risk-registry/v1
triggers:
  historical_behavior_change:
    minimum_profile: lite
    gates: [impact_analysis, impact_reconcile, related_tests, contract_differential]
  hidden_dependency:
    minimum_profile: standard
    gates: [impact_analysis, impact_reconcile, impact_review, integration_tests]
  public_contract_change:
    minimum_profile: standard
    gates: [impact_analysis, impact_reconcile, api_contract, architecture_review, full_chain_smoke, rollback_verification]
  core_algorithm:
    minimum_profile: standard
    gates: [api_contract, integration_tests, independent_review]
  cross_system:
    minimum_profile: standard
    gates: [api_contract, integration_tests, full_chain_smoke]
  persistent_state_machine:
    minimum_profile: standard
    gates: [api_contract, integration_tests, rollback_verification]
  quota:
    minimum_profile: strict
    gates: [api_contract, security_review, independent_review]
  architecture_coupling:
    minimum_profile: standard
    gates: [architecture_review, impact_review]
  untrusted_input:
    minimum_profile: standard
    gates: [security_review, related_tests]
  archive_parsing:
    minimum_profile: standard
    gates: [security_review, related_tests]
  concurrency:
    minimum_profile: standard
    gates: [integration_tests]
  external_dependency:
    minimum_profile: standard
    gates: [integration_tests]
  persistence:
    minimum_profile: standard
    gates: [integration_tests]
  irreversible_write:
    minimum_profile: standard
    gates: [security_review]
  authentication:
    minimum_profile: strict
    gates: [api_contract, security_review, full_regression, independent_review]
  authorization:
    minimum_profile: strict
    gates: [api_contract, security_review, full_regression, independent_review]
  secrets:
    minimum_profile: strict
    gates: [security_review, credential_scan, independent_review]
  payment:
    minimum_profile: strict
    gates: [api_contract, full_regression, security_review, independent_review]
  regulated:
    minimum_profile: strict
    gates: [full_regression, security_review, independent_review]
  migration:
    minimum_profile: strict
    gates: [full_regression, rollback_verification, security_review, independent_review]
  ui_change:
    minimum_profile: lite
    gates: [ui_contract]
  cross_platform_deployment:
    minimum_profile: standard
    gates: [release_target_preflight]
  runtime_config_change:
    minimum_profile: standard
    gates: [release_target_preflight, integration_tests]
  stateful_upgrade:
    minimum_profile: standard
    gates: [release_target_preflight, release_recovery_readiness, integration_tests]
  public_network_exposure:
    minimum_profile: strict
    gates: [release_target_preflight, release_live_verification, security_review, independent_review]
  multi_service_release:
    minimum_profile: standard
    gates: [release_target_preflight, release_live_verification, integration_tests]
  infrastructure_change:
    minimum_profile: strict
    gates: [release_target_preflight, rollback_verification, security_review, independent_review]
