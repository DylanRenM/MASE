schema: mase-gates/v1
retention: 3
overlap_warning_threshold: 0.8
gates:
  related_tests:
    stage: capability
    command:
    - python3
    - -m
    - pytest
    - -q
    - tests/test_mase_gate_planning.py
    - tests/test_mase_gate_evidence.py
    - tests/test_mase_context.py
    - tests/test_mase_profiles.py
    inputs:
    - mase_cli/gates.py
    - mase_cli/evidence.py
    - mase_cli/state.py
    - tests/test_mase_gate_planning.py
    - tests/test_mase_gate_evidence.py
    - tests/test_mase_context.py
    - tests/test_mase_profiles.py
    tests:
    - tests/test_mase_gate_planning.py
    - tests/test_mase_gate_evidence.py
    - tests/test_mase_context.py
    - tests/test_mase_profiles.py
  api_contract:
    stage: capability
    command:
    - python3
    - -m
    - pytest
    - -q
    - tests/test_mase_gate_planning.py
    - tests/test_mase_cli_operations.py
    - tests/test_mase_governance_models.py
    inputs:
    - mase_cli
    - schemas
    - tests/test_mase_gate_planning.py
    - tests/test_mase_cli_operations.py
    - tests/test_mase_governance_models.py
    tests:
    - tests/test_mase_gate_planning.py
    - tests/test_mase_cli_operations.py
    - tests/test_mase_governance_models.py
  integration_tests:
    stage: capability
    command:
    - python3
    - -m
    - pytest
    - -q
    - tests/test_mase_cli_stacks.py
    - tests/test_mase_update.py
    - tests/test_mase_governance_migration.py
    inputs:
    - mase_cli
    - templates
    - framework-manifest.yaml
    - tests/test_mase_cli_stacks.py
    - tests/test_mase_update.py
    - tests/test_mase_governance_migration.py
    tests:
    - tests/test_mase_cli_stacks.py
    - tests/test_mase_update.py
    - tests/test_mase_governance_migration.py
  security_review:
    stage: capability
    command:
    - python3
    - -m
    - pytest
    - -q
    - tests/test_mase_gate_evidence.py::test_gate_runner_redacts_persisted_command_environment_and_log
    - tests/test_mase_cli_operations.py::test_gate_cli_rejects_unsafe_change_before_running_command
    - tests/test_mase_cli_operations.py::test_install_rejects_manifest_path_traversal
    - tests/test_mase_gate_planning.py::test_gate_loader_validates_schema_and_rejects_escaping_inputs
    inputs:
    - mase_cli/evidence.py
    - mase_cli/gates.py
    - mase_cli/main.py
    - tests/test_mase_gate_evidence.py
    - tests/test_mase_cli_operations.py
    - tests/test_mase_gate_planning.py
    tests:
    - credential-redaction
    - change-path-traversal
    - manifest-path-traversal
    - gate-input-traversal
  full_regression:
    stage: final
    candidate_bound: true
    command:
    - python3
    - -m
    - pytest
    - -q
    - tests
    inputs:
    - mase_cli
    - profiles
    - schemas
    - templates
    - tests
    - pyproject.toml
    - framework-manifest.yaml
    - project-rules.md
    tests:
    - tests
