schema: mase-gates/v1
retention: 3
overlap_warning_threshold: 0.8
gates:
  impact_analysis:
    stage: analysis
    command:
    - python3
    - -m
    - mase_cli.main
    - impact
    - validate
    - --change
    - "{change}"
    inputs:
    - mase_cli/impact.py
    - mase_cli/risk.py
    - mase_cli/state.py
    - schemas/mase-impact-analysis.schema.json
    - schemas/mase-impact-scan.schema.json
    - schemas/mase-state.schema.json
    - profiles
  impact_reconcile:
    stage: capability
    command:
    - python3
    - -m
    - mase_cli.main
    - impact
    - status
    - --change
    - "{change}"
    - --require-matched
    inputs:
    - mase_cli/impact.py
    - mase_cli/gates.py
    - mase_cli/state.py
    - schemas/mase-impact-analysis.schema.json
    - tests/test_mase_impact_analysis.py
  contract_differential:
    stage: micro
    command:
    - python3
    - -m
    - pytest
    - -q
    - tests/test_mase_impact_analysis.py
    inputs:
    - mase_cli/impact.py
    - schemas/mase-impact-analysis.schema.json
    - tests/test_mase_impact_analysis.py
    tests:
    - tests/test_mase_impact_analysis.py
  impact_review:
    stage: capability
    mode: manual
    command:
    - manual
    inputs:
    - project-rules.md
    - docs/MASE-framework.md
    - docs/design-principles.md
  architecture_review:
    stage: capability
    mode: manual
    command:
    - manual
    inputs:
    - project-rules.md
    - docs/MASE-framework.md
    - schemas/mase-impact-analysis.schema.json
  full_chain_smoke:
    stage: capability
    command:
    - python3
    - -m
    - pytest
    - -q
    - tests/test_mase_impact_analysis.py
    - tests/test_mase_gate_planning.py
    - tests/test_mase_cli_operations.py
    inputs:
    - mase_cli
    - schemas
    - templates
    - profiles
    - tests/test_mase_impact_analysis.py
    - tests/test_mase_gate_planning.py
    - tests/test_mase_cli_operations.py
    tests:
    - tests/test_mase_impact_analysis.py
    - tests/test_mase_gate_planning.py
    - tests/test_mase_cli_operations.py
  rollback_verification:
    stage: capability
    command:
    - python3
    - -m
    - pytest
    - -q
    - tests/test_mase_update.py
    - tests/test_mase_cli_stacks.py
    - tests/test_mase_impact_analysis.py
    inputs:
    - mase_cli/commands/init_project.py
    - mase_cli/commands/update_project.py
    - mase_cli/impact.py
    - templates
    - tests/test_mase_update.py
    - tests/test_mase_cli_stacks.py
    - tests/test_mase_impact_analysis.py
    tests:
    - tests/test_mase_update.py
    - tests/test_mase_cli_stacks.py
    - tests/test_mase_impact_analysis.py
  related_tests:
    stage: capability
    command:
    - python3
    - -m
    - pytest
    - -q
    - tests/test_mase_gate_planning.py
    - tests/test_mase_gate_evidence.py
    - tests/test_mase_context.py
    - tests/test_mase_profiles.py
    - tests/test_mase_training_deck.py
    - tests/test_release_governance.py
    - tests/test_repository_boundary.py
    - tests/test_distribution_integrity.py
    - tests/test_mase_test_selection.py
    - tests/test_webapp_reporter.py
    - tests/test_mase_impact_analysis.py
    inputs:
    - mase_cli/gates.py
    - mase_cli/evidence.py
    - mase_cli/state.py
    - tests/test_mase_gate_planning.py
    - tests/test_mase_gate_evidence.py
    - tests/test_mase_context.py
    - tests/test_mase_profiles.py
    - scripts/build_mase_training_deck.py
    - scripts/verify_mase_training_deck.py
    - training/mase-framework/mase-training-v2.3.yaml
    - training/mase-framework/MASE框架培训讲义V2.3.pptx
    - tests/test_mase_training_deck.py
    - tests/test_release_governance.py
    - tests/test_repository_boundary.py
    - tests/test_distribution_integrity.py
    - mase_cli/test_selection.py
    - schemas/mase-test-manifest.schema.json
    - schemas/mase-test-diagnostic.schema.json
    - skills/webapp-testing/mase-reporter.cjs
    - tests/test_mase_test_selection.py
    - tests/test_webapp_reporter.py
    - tests/test_mase_impact_analysis.py
    tests:
    - tests/test_mase_gate_planning.py
    - tests/test_mase_gate_evidence.py
    - tests/test_mase_context.py
    - tests/test_mase_profiles.py
    - tests/test_mase_training_deck.py
    - tests/test_release_governance.py
    - tests/test_repository_boundary.py
    - tests/test_distribution_integrity.py
    - tests/test_mase_test_selection.py
    - tests/test_mase_impact_analysis.py
    - tests/test_webapp_reporter.py
  api_contract:
    stage: capability
    command:
    - python3
    - -m
    - pytest
    - -q
    - tests/test_mase_gate_planning.py
    - tests/test_mase_cli_operations.py
    - tests/test_mase_governance_models.py
    - tests/test_risk_driven_property_testing.py
    - tests/test_release_governance.py
    - tests/test_distribution_integrity.py
    - tests/test_mase_test_selection.py
    - tests/test_mase_impact_analysis.py
    inputs:
    - mase_cli
    - schemas
    - tests/test_mase_gate_planning.py
    - tests/test_mase_cli_operations.py
    - tests/test_mase_governance_models.py
    - tests/test_risk_driven_property_testing.py
    - tests/test_release_governance.py
    - tests/test_distribution_integrity.py
    - mase_cli/test_selection.py
    - schemas/mase-test-manifest.schema.json
    - schemas/mase-test-diagnostic.schema.json
    - tests/test_mase_test_selection.py
    tests:
    - tests/test_mase_gate_planning.py
    - tests/test_mase_cli_operations.py
    - tests/test_mase_governance_models.py
    - tests/test_risk_driven_property_testing.py
    - tests/test_release_governance.py
    - tests/test_distribution_integrity.py
    - tests/test_mase_test_selection.py
  integration_tests:
    stage: capability
    command:
    - python3
    - -m
    - pytest
    - -q
    - tests/test_mase_cli_stacks.py
    - tests/test_mase_update.py
    - tests/test_mase_governance_migration.py
    - tests/test_repository_boundary.py
    - tests/test_distribution_integrity.py
    inputs:
    - mase_cli
    - templates
    - framework-manifest.yaml
    - tests/test_mase_cli_stacks.py
    - tests/test_mase_update.py
    - tests/test_mase_governance_migration.py
    - tests/test_repository_boundary.py
    - tests/test_distribution_integrity.py
    tests:
    - tests/test_mase_cli_stacks.py
    - tests/test_mase_update.py
    - tests/test_mase_governance_migration.py
    - tests/test_repository_boundary.py
    - tests/test_distribution_integrity.py
  security_review:
    stage: capability
    command:
    - python3
    - -m
    - pytest
    - -q
    - tests/test_mase_gate_evidence.py::test_gate_runner_redacts_persisted_command_environment_and_log
    - tests/test_mase_cli_operations.py::test_gate_cli_rejects_unsafe_change_before_running_command
    - tests/test_mase_cli_operations.py::test_install_rejects_manifest_path_traversal
    - tests/test_mase_gate_planning.py::test_gate_loader_validates_schema_and_rejects_escaping_inputs
    - tests/test_release_governance.py::test_read_only_authority_blocks_effectful_release_before_command
    - tests/test_release_governance.py::test_release_gate_not_selected_by_overlay_intent_is_blocked
    - tests/test_repository_boundary.py
    inputs:
    - mase_cli/evidence.py
    - mase_cli/gates.py
    - mase_cli/main.py
    - tests/test_mase_gate_evidence.py
    - tests/test_mase_cli_operations.py
    - tests/test_mase_gate_planning.py
    - tests/test_release_governance.py
    - tests/test_repository_boundary.py
    tests:
    - credential-redaction
    - change-path-traversal
    - manifest-path-traversal
    - gate-input-traversal
    - release-authority
    - release-overlay-applicability
    - repository-boundary
  code_review:
    stage: capability
    mode: manual
    command:
    - manual
    inputs:
    - project-rules.md
    - .mase/gates.yaml
  independent_review:
    stage: capability
    mode: manual
    command:
    - manual
    inputs:
    - project-rules.md
    - .mase/gates.yaml
  full_regression:
    stage: final
    candidate_bound: true
    command:
    - python3
    - scripts/run_framework_regression.py
    inputs:
    - mase_cli
    - profiles
    - schemas
    - templates
    - skills
    - docs
    - scripts
    - tests
    - openspec/specs
    - pyproject.toml
    - package.json
    - package-lock.json
    - framework-manifest.yaml
    - project-rules.md
    - scripts/build_mase_training_deck.py
    - scripts/verify_mase_training_deck.py
    - training/mase-framework/mase-training-v2.3.yaml
    - training/mase-framework/MASE框架培训讲义V2.3.pptx
    tests:
    - tests
    - tests/sandbox/sandbox.test.js
