[project]
name = "mase"
version = "2.0.0"
description = "MASE (Measures AI Software Engineering) — 麦哲思AI软件开发统一流程 CLI"
requires-python = ">=3.9"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Measures" }]
keywords = ["ai", "software-engineering", "framework", "tdd", "dev-process"]
dependencies = ["PyYAML>=6.0"]

[project.scripts]
mase = "mase_cli.main:main"

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "ruff>=0.9"]

[tool.setuptools.packages.find]
include = ["mase_cli*"]

[tool.setuptools.data-files]
"share/mase" = ["framework-manifest.yaml", "project-rules.md"]
"share/mase/profiles" = ["profiles/*.yaml"]
"share/mase/schemas" = ["schemas/*.json"]
